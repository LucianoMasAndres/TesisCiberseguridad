[global]
   workgroup = LAB
   server string = Lab File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no

[publico]
   comment = Recurso compartido de laboratorio (acceso de invitado habilitado)
   path = /srv/samba/publico
   browsable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   directory mask = 0777

# Laboratorio de 12 activos objetivo (ground truth v2 — ver docs/anexo_e_f_v2.md).
# Patron: un contenedor "anchor" por host fija la IP en la red lab-net; los
# contenedores de servicio se adjuntan a su namespace de red con
# network_mode: service:<anchor>, asi que comparten IP y puertos con el anchor.
#
# Uso:
#   docker compose -f docker-compose.lab-targets.yml build
#   docker compose -f docker-compose.lab-targets.yml up -d
#
# Se conecta a la misma red que usa el stack de n8n/Greenbone si se define
# como red externa (ver README del repo para instrucciones de integracion).

networks:
  lab-net:
    name: lab-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  # ===== 172.20.0.10 — Web publica (Normal) =====
  anchor-10:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
  web-10-http:
    image: nginx:1.25-alpine
    network_mode: "service:anchor-10"
    depends_on: [anchor-10]
    restart: unless-stopped
  web-10-https:
    build: ./nginx-tls
    network_mode: "service:anchor-10"
    depends_on: [anchor-10]
    restart: unless-stopped

  # ===== 172.20.0.11 — Landing interna (Normal) =====
  anchor-11:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.11
    restart: unless-stopped
  web-11:
    image: httpd:2.4-alpine
    network_mode: "service:anchor-11"
    depends_on: [anchor-11]
    restart: unless-stopped

  # ===== 172.20.0.12 — Panel admin interno (Alto) =====
  anchor-12:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.12
    restart: unless-stopped
  web-12:
    image: nginx:1.25-alpine
    network_mode: "service:anchor-12"
    depends_on: [anchor-12]
    restart: unless-stopped
  ssh-12:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-12"
    depends_on: [anchor-12]
    restart: unless-stopped

  # ===== 172.20.0.13 — BD de desarrollo (Critico) =====
  anchor-13:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.13
    restart: unless-stopped
  db-13:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: labpass123
    network_mode: "service:anchor-13"
    depends_on: [anchor-13]
    restart: unless-stopped
  ssh-13:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-13"
    depends_on: [anchor-13]
    restart: unless-stopped
  smb-13:
    build: ./legacy
    command: ["smb"]
    network_mode: "service:anchor-13"
    depends_on: [anchor-13]
    restart: unless-stopped

  # ===== 172.20.0.14 — Replica de BD (Alto) =====
  anchor-14:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.14
    restart: unless-stopped
  db-14:
    image: postgres:9.6
    environment:
      POSTGRES_PASSWORD: labpass123
    network_mode: "service:anchor-14"
    depends_on: [anchor-14]
    restart: unless-stopped
  ssh-14:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-14"
    depends_on: [anchor-14]
    restart: unless-stopped

  # ===== 172.20.0.15 — Directorio corporativo (Alto) =====
  anchor-15:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.15
    restart: unless-stopped
  ldap-15:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ALLOW_ANON_BINDING: "true"
    network_mode: "service:anchor-15"
    depends_on: [anchor-15]
    restart: unless-stopped
  web-15:
    image: nginx:1.25-alpine
    network_mode: "service:anchor-15"
    depends_on: [anchor-15]
    restart: unless-stopped

  # ===== 172.20.0.16 — Servidor de correo (Alto) =====
  anchor-16:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.16
    restart: unless-stopped
  mail-16:
    build: ./legacy
    command: ["postfix"]
    network_mode: "service:anchor-16"
    depends_on: [anchor-16]
    restart: unless-stopped
  ssh-16:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-16"
    depends_on: [anchor-16]
    restart: unless-stopped

  # ===== 172.20.0.17 — Dispositivo de red (Critico) =====
  anchor-17:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.17
    restart: unless-stopped
  snmp-17:
    build: ./legacy
    command: ["snmp"]
    network_mode: "service:anchor-17"
    depends_on: [anchor-17]
    restart: unless-stopped
  telnet-17:
    build: ./legacy
    command: ["telnet"]
    network_mode: "service:anchor-17"
    depends_on: [anchor-17]
    restart: unless-stopped
  smb-17:
    build: ./legacy
    command: ["smb"]
    network_mode: "service:anchor-17"
    depends_on: [anchor-17]
    restart: unless-stopped

  # ===== 172.20.0.18 — Servicio de reportes (Normal) =====
  anchor-18:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.18
    restart: unless-stopped
  web-18:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx-8080/default.conf:/etc/nginx/conf.d/default.conf:ro
    network_mode: "service:anchor-18"
    depends_on: [anchor-18]
    restart: unless-stopped

  # ===== 172.20.0.19 — Servidor FTP (Alto) =====
  anchor-19:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.19
    restart: unless-stopped
  ftp-19:
    build: ./legacy
    command: ["ftp"]
    network_mode: "service:anchor-19"
    depends_on: [anchor-19]
    restart: unless-stopped
  ssh-19:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-19"
    depends_on: [anchor-19]
    restart: unless-stopped

  # ===== 172.20.0.20 — File server SMB (Alto) =====
  anchor-20:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.20
    restart: unless-stopped
  smb-20:
    build: ./legacy
    command: ["smb"]
    network_mode: "service:anchor-20"
    depends_on: [anchor-20]
    restart: unless-stopped
  ssh-20:
    build: ./legacy
    command: ["ssh"]
    network_mode: "service:anchor-20"
    depends_on: [anchor-20]
    restart: unless-stopped

  # ===== 172.20.0.21 — Cache expuesto (Critico) =====
  anchor-21:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    networks:
      lab-net:
        ipv4_address: 172.20.0.21
    restart: unless-stopped
  redis-21:
    image: redis:5-alpine
    command: ["redis-server", "--protected-mode", "no"]
    network_mode: "service:anchor-21"
    depends_on: [anchor-21]
    restart: unless-stopped
  web-21:
    image: nginx:1.25-alpine
    network_mode: "service:anchor-21"
    depends_on: [anchor-21]
    restart: unless-stopped
  ftp-21:
    build: ./legacy
    command: ["ftp"]
    network_mode: "service:anchor-21"
    depends_on: [anchor-21]
    restart: unless-stopped
